name: Build and Release Multi-Platform Client

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: './Client/Client.csproj'

jobs:
  cleanup-artifacts:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    
    permissions:
      actions: write
    
    steps:
      - name: Delete old artifacts (keep top 2)
        uses: actions/github-script@v7
        with:
          script: |
            const artifactNames = [
              'windows-client',
              'macos-client-x64', 
              'macos-client-arm64',
              'android-client'
            ];
            
            for (const artifactName of artifactNames) {
              console.log(`Processing artifacts for: ${artifactName}`);
              
              try {
                // List all artifacts with this name (with pagination support)
                let allArtifacts = [];
                let page = 1;
                let hasMore = true;
                
                while (hasMore) {
                  const artifacts = await github.rest.actions.listArtifactsForRepo({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: artifactName,
                    per_page: 100,
                    page: page
                  });
                  
                  allArtifacts = allArtifacts.concat(artifacts.data.artifacts);
                  hasMore = artifacts.data.artifacts.length === 100;
                  page++;
                }
                
                console.log(`Found ${allArtifacts.length} artifacts for ${artifactName}`);
                
                // Sort by creation date (newest first)
                const sortedArtifacts = allArtifacts.sort((a, b) => 
                  new Date(b.created_at) - new Date(a.created_at)
                );
                
                // Keep top 2, delete the rest
                const toDelete = sortedArtifacts.slice(2);
                console.log(`Keeping top 2, deleting ${toDelete.length} old artifacts for ${artifactName}`);
                
                for (const artifact of toDelete) {
                  try {
                    console.log(`Deleting artifact ${artifact.id} (created: ${artifact.created_at})`);
                    await github.rest.actions.deleteArtifact({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      artifact_id: artifact.id
                    });
                  } catch (deleteError) {
                    console.error(`Failed to delete artifact ${artifact.id}: ${deleteError.message}`);
                    // Continue with next artifact even if one fails
                  }
                }
              } catch (error) {
                console.error(`Error processing ${artifactName}: ${error.message}`);
                // Continue with next artifact name even if one fails
              }
            }
            
            console.log('Artifact cleanup completed');

  build-windows:
    name: Build Windows Client
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build Windows Client
        run: dotnet publish ${{ env.PROJECT_PATH }} -f net10.0 -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o ./publish/win-x64

      - name: Create Windows ZIP archive
        run: |
          cd ./publish/win-x64
          Compress-Archive -Path * -DestinationPath ../../HBArbitrageRobot-Client-Windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: ./HBArbitrageRobot-Client-Windows-x64.zip
          retention-days: 3

  build-macos:
    name: Build macOS Client
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build macOS Client (x64)
        run: dotnet publish ${{ env.PROJECT_PATH }} -f net10.0 -c Release -r osx-x64 --self-contained -p:PublishSingleFile=true -o ./publish/osx-x64

      - name: Build macOS Client (ARM64)
        run: dotnet publish ${{ env.PROJECT_PATH }} -f net10.0 -c Release -r osx-arm64 --self-contained -p:PublishSingleFile=true -o ./publish/osx-arm64

      - name: Create macOS ZIP archives
        run: |
          cd ./publish/osx-x64
          zip -r ../../HBArbitrageRobot-Client-macOS-x64.zip *
          cd ../osx-arm64
          zip -r ../../HBArbitrageRobot-Client-macOS-ARM64.zip *

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-client-x64
          path: ./HBArbitrageRobot-Client-macOS-x64.zip
          retention-days: 3

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-client-arm64
          path: ./HBArbitrageRobot-Client-macOS-ARM64.zip
          retention-days: 3

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }} /p:BuildForAndroid=true

      - name: Build Android APK
        run: dotnet publish ${{ env.PROJECT_PATH }} -f net10.0-android -c Release /p:BuildForAndroid=true -o ./publish/android

      - name: Find and rename APK
        run: |
          APK_FILE=$(find ./publish/android -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" ./HBArbitrageRobot-Client-Android.apk
            echo "APK found and copied: $APK_FILE"
          else
            echo "No APK file found!"
            ls -R ./publish/android
            exit 1
          fi

      - name: Align APK for 16KB page size (Android 16 compatibility)
        run: |
          # Check if ANDROID_HOME is set
          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: ANDROID_HOME environment variable is not set"
            exit 1
          fi

          # Find zipalign tool from Android SDK (use the latest version)
          # First try to get the latest stable version, fallback to any version if needed
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" -type f 2>/dev/null | \
            grep -v '\-rc\|\-alpha\|\-beta' | sort -Vr | head -n 1)
          
          # If no stable version found, try any version
          if [ -z "$ZIPALIGN" ]; then
            ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" -type f 2>/dev/null | \
              sort -Vr | head -n 1)
          fi
          
          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found in Android SDK build-tools"
            echo "Checked in: $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using zipalign: $ZIPALIGN"

          # Verify input APK exists
          if [ ! -f "./HBArbitrageRobot-Client-Android.apk" ]; then
            echo "ERROR: Input APK not found"
            exit 1
          fi

          # Create a backup of the original APK
          echo "Creating backup of original APK..."
          cp ./HBArbitrageRobot-Client-Android.apk ./HBArbitrageRobot-Client-Android-original.apk

          # Realign APK with 16KB page size for Android 16 compatibility
          # The -P flag with value 16 (16KB) ensures native libraries are aligned correctly
          echo "Aligning APK with 16KB page size..."
          $ZIPALIGN -f -P 16 4 ./HBArbitrageRobot-Client-Android-original.apk ./HBArbitrageRobot-Client-Android.apk

          # Verify alignment
          echo "Verifying alignment..."
          if ! $ZIPALIGN -c -P 16 4 ./HBArbitrageRobot-Client-Android.apk; then
            echo "ERROR: APK alignment verification failed"
            exit 1
          fi
          echo "APK successfully aligned for 16KB page size"

          # Clean up backup file
          echo "Cleaning up backup file..."
          rm -f ./HBArbitrageRobot-Client-Android-original.apk
          echo "Alignment process completed successfully"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-client
          path: ./HBArbitrageRobot-Client-Android.apk
          retention-days: 3

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/windows-client/HBArbitrageRobot-Client-Windows-x64.zip
            ./artifacts/macos-client-x64/HBArbitrageRobot-Client-macOS-x64.zip
            ./artifacts/macos-client-arm64/HBArbitrageRobot-Client-macOS-ARM64.zip
            ./artifacts/android-client/HBArbitrageRobot-Client-Android.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-latest:
    name: Publish Latest Builds
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Update or Create Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Development Build
          files: |
            ./artifacts/windows-client/HBArbitrageRobot-Client-Windows-x64.zip
            ./artifacts/macos-client-x64/HBArbitrageRobot-Client-macOS-x64.zip
            ./artifacts/macos-client-arm64/HBArbitrageRobot-Client-macOS-ARM64.zip
            ./artifacts/android-client/HBArbitrageRobot-Client-Android.apk
          draft: false
          prerelease: true
          body: |
            **Latest development build from main branch**

            This is an automated build from the latest commit on the main branch.

            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            Download the appropriate build for your platform:
            - **Windows:** HBArbitrageRobot-Client-Windows-x64.zip
            - **macOS (Intel):** HBArbitrageRobot-Client-macOS-x64.zip
            - **macOS (Apple Silicon):** HBArbitrageRobot-Client-macOS-ARM64.zip
            - **Android:** HBArbitrageRobot-Client-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
