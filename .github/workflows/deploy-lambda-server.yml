name: Deploy Server to AWS Lambda

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Server/**'
      - '.github/workflows/deploy-lambda-server.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  FUNCTION_NAME: HBArbitrageServer
  ECR_REPOSITORY: hbarbitrageserver
  API_NAME: HBArbitrageServerApi
  API_STAGE: prod

jobs:
  deploy:
    name: Build and Deploy Server to Lambda
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Ensure ECR Repository Exists
        id: ecr-repo
        run: |
          # Check if ECR repository exists, create if not
          if aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "ECR repository already exists"
          else
            echo "Creating ECR repository..."
            aws ecr create-repository \
              --repository-name ${{ env.ECR_REPOSITORY }} \
              --image-scanning-configuration scanOnPush=true \
              --region ${{ env.AWS_REGION }}
            
            # Set lifecycle policy to keep only last 10 images
            aws ecr put-lifecycle-policy \
              --repository-name ${{ env.ECR_REPOSITORY }} \
              --lifecycle-policy-text '{
                "rules": [{
                  "rulePriority": 1,
                  "description": "Keep last 10 images",
                  "selection": {
                    "tagStatus": "any",
                    "countType": "imageCountMoreThan",
                    "countNumber": 10
                  },
                  "action": {
                    "type": "expire"
                  }
                }]
              }' \
              --region ${{ env.AWS_REGION }}
          fi
          
          # Get repository URI
          REPO_URI=$(aws ecr describe-repositories \
            --repository-names ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "repository_uri=$REPO_URI" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Server/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-repo.outputs.repository_uri }}:latest
            ${{ steps.ecr-repo.outputs.repository_uri }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Force Docker v2 schema format for AWS Lambda compatibility
          provenance: false
          outputs: type=image,name=${{ steps.ecr-repo.outputs.repository_uri }},push=true,oci-mediatypes=false
      
      - name: Ensure Lambda Function Exists
        id: lambda-check
        run: |
          # Check if Lambda function exists
          if aws lambda get-function --function-name ${{ env.FUNCTION_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Lambda function exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Lambda function does not exist - will provide creation instructions"
          fi
      
      - name: Create Lambda Function (if not exists)
        if: steps.lambda-check.outputs.exists == 'false'
        run: |
          echo "Creating Lambda function..."
          
          # Create execution role if it doesn't exist
          ROLE_NAME="${{ env.FUNCTION_NAME }}-role"
          
          # Check if role exists
          if aws iam get-role --role-name $ROLE_NAME >/dev/null 2>&1; then
            echo "IAM role already exists"
          else
            echo "Creating IAM role..."
            
            # Define trust policy document
            TRUST_POLICY='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
            
            # Try to create role, but don't fail if it already exists
            CREATE_ROLE_OUTPUT=$(aws iam create-role \
              --role-name $ROLE_NAME \
              --assume-role-policy-document "$TRUST_POLICY" 2>&1) || {
              if echo "$CREATE_ROLE_OUTPUT" | grep -q "EntityAlreadyExists"; then
                echo "IAM role was created by another process, continuing..."
              else
                echo "Error creating IAM role: $CREATE_ROLE_OUTPUT"
                exit 1
              fi
            }
            
            # Attach basic execution policy (idempotent operation)
            POLICY_ARN="arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
            ATTACH_OUTPUT=$(aws iam attach-role-policy \
              --role-name $ROLE_NAME \
              --policy-arn $POLICY_ARN 2>&1) || {
              # Handle specific error cases
              if echo "$ATTACH_OUTPUT" | grep -q "PolicyAlreadyAttached"; then
                echo "Policy already attached, continuing..."
              elif echo "$ATTACH_OUTPUT" | grep -q "NoSuchEntity"; then
                echo "Role not yet available, waiting and retrying..."
                sleep 5
                RETRY_OUTPUT=$(aws iam attach-role-policy \
                  --role-name $ROLE_NAME \
                  --policy-arn $POLICY_ARN 2>&1) || {
                  echo "Error: Failed to attach policy after retry: $RETRY_OUTPUT"
                  exit 1
                }
                echo "Policy attached successfully on retry"
              else
                echo "Error: Failed to attach policy: $ATTACH_OUTPUT"
                exit 1
              fi
            }
            
            # Wait for role to be available
            echo "Waiting for IAM role to be ready..."
            sleep 10
          fi
          
          # Get role ARN
          ROLE_ARN=$(aws iam get-role --role-name $ROLE_NAME --query 'Role.Arn' --output text)
          
          # Create Lambda function
          aws lambda create-function \
            --function-name ${{ env.FUNCTION_NAME }} \
            --package-type Image \
            --code ImageUri=${{ steps.ecr-repo.outputs.repository_uri }}:latest \
            --role $ROLE_ARN \
            --architectures x86_64 \
            --timeout 900 \
            --memory-size 512 \
            --environment "Variables={ASPNETCORE_ENVIRONMENT=Production,ASPNETCORE_URLS=http://+:8080,API_TOKEN=${{ secrets.API_TOKEN }}}" \
            --region ${{ env.AWS_REGION }}
          
          echo "Lambda function created successfully!"
          
          # Create Function URL with no auth (app-level token)
          aws lambda create-function-url-config \
            --function-name ${{ env.FUNCTION_NAME }} \
            --auth-type NONE \
            --cors "AllowOrigins=*,AllowMethods=GET,POST,AllowHeaders=*,MaxAge=3600" \
            --region ${{ env.AWS_REGION }}
      
      - name: Update Lambda Function Code
        if: steps.lambda-check.outputs.exists == 'true'
        run: |
          echo "Updating Lambda function code..."
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --image-uri ${{ steps.ecr-repo.outputs.repository_uri }}:latest \
            --region ${{ env.AWS_REGION }}
          
          # Wait for update to complete
          aws lambda wait function-updated \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}
          
          echo "Lambda function updated successfully!"
      
      - name: Update Lambda Function Configuration
        if: steps.lambda-check.outputs.exists == 'true'
        run: |
          echo "Updating Lambda function configuration..."
          aws lambda update-function-configuration \
            --function-name ${{ env.FUNCTION_NAME }} \
            --environment "Variables={ASPNETCORE_ENVIRONMENT=Production,ASPNETCORE_URLS=http://+:8080,API_TOKEN=${{ secrets.API_TOKEN }}}" \
            --region ${{ env.AWS_REGION }}
      
      - name: Configure Function URL (if not exists)
        if: steps.lambda-check.outputs.exists == 'true'
        run: |
          # Check if Function URL already exists
          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'FunctionUrl' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$FUNCTION_URL" ]; then
            echo "Function URL does not exist, creating..."
            
            # Create Function URL with no auth (app-level token)
            aws lambda create-function-url-config \
              --function-name ${{ env.FUNCTION_NAME }} \
              --auth-type NONE \
              --cors "AllowOrigins=*,AllowMethods=GET,POST,AllowHeaders=*,MaxAge=3600" \
              --region ${{ env.AWS_REGION }}
            
            echo "✅ Function URL created successfully!"
          else
            echo "Function URL already exists: $FUNCTION_URL"
            echo "Updating Function URL config to no auth..."
            aws lambda update-function-url-config \
              --function-name ${{ env.FUNCTION_NAME }} \
              --auth-type NONE \
              --cors "AllowOrigins=*,AllowMethods=GET,POST,AllowHeaders=*,MaxAge=3600" \
              --region ${{ env.AWS_REGION }}
          fi
      
      - name: Configure API Gateway HTTP API
        id: api-gateway
        run: |
          set -euo pipefail

          echo "Ensuring HTTP API exists..."
          API_ID=$(aws apigatewayv2 get-apis \
            --region ${{ env.AWS_REGION }} \
            --query "Items[?Name=='${{ env.API_NAME }}'].ApiId | [0]" \
            --output text)

          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            API_ID=$(aws apigatewayv2 create-api \
              --name ${{ env.API_NAME }} \
              --protocol-type HTTP \
              --cors-configuration "AllowOrigins=*,AllowMethods=GET,POST,OPTIONS,AllowHeaders=*,MaxAge=3600" \
              --region ${{ env.AWS_REGION }} \
              --query 'ApiId' \
              --output text)
            echo "Created API Gateway: $API_ID"
          else
            echo "API Gateway already exists: $API_ID"
          fi

          LAMBDA_ARN=$(aws lambda get-function \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Configuration.FunctionArn' \
            --output text)

          INTEGRATION_ID=$(aws apigatewayv2 get-integrations \
            --api-id $API_ID \
            --region ${{ env.AWS_REGION }} \
            --query "Items[?IntegrationUri=='$LAMBDA_ARN'].IntegrationId | [0]" \
            --output text)

          if [ -z "$INTEGRATION_ID" ] || [ "$INTEGRATION_ID" = "None" ]; then
            INTEGRATION_ID=$(aws apigatewayv2 create-integration \
              --api-id $API_ID \
              --integration-type AWS_PROXY \
              --integration-uri $LAMBDA_ARN \
              --payload-format-version 2.0 \
              --region ${{ env.AWS_REGION }} \
              --query 'IntegrationId' \
              --output text)
            echo "Created integration: $INTEGRATION_ID"
          else
            echo "Integration already exists: $INTEGRATION_ID"
          fi

          ROUTE_ID=$(aws apigatewayv2 get-routes \
            --api-id $API_ID \
            --region ${{ env.AWS_REGION }} \
            --query "Items[?RouteKey=='ANY /{proxy+}'].RouteId | [0]" \
            --output text)

          if [ -z "$ROUTE_ID" ] || [ "$ROUTE_ID" = "None" ]; then
            aws apigatewayv2 create-route \
              --api-id $API_ID \
              --route-key "ANY /{proxy+}" \
              --target "integrations/$INTEGRATION_ID" \
              --region ${{ env.AWS_REGION }}
            echo "Created route: ANY /{proxy+}"
          else
            echo "Route already exists: $ROUTE_ID"
          fi

          STAGE_NAME=${{ env.API_STAGE }}
          STAGE_EXISTS=$(aws apigatewayv2 get-stages \
            --api-id $API_ID \
            --region ${{ env.AWS_REGION }} \
            --query "Items[?StageName=='$STAGE_NAME'].StageName | [0]" \
            --output text)

          if [ -z "$STAGE_EXISTS" ] || [ "$STAGE_EXISTS" = "None" ]; then
            aws apigatewayv2 create-stage \
              --api-id $API_ID \
              --stage-name $STAGE_NAME \
              --auto-deploy \
              --region ${{ env.AWS_REGION }}
            echo "Created stage: $STAGE_NAME"
          else
            aws apigatewayv2 update-stage \
              --api-id $API_ID \
              --stage-name $STAGE_NAME \
              --auto-deploy \
              --region ${{ env.AWS_REGION }}
            echo "Updated stage: $STAGE_NAME"
          fi

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          SOURCE_ARN="arn:aws:execute-api:${{ env.AWS_REGION }}:${ACCOUNT_ID}:${API_ID}/*/*/*"
          STATEMENT_ID="${{ env.FUNCTION_NAME }}-apigw"

          if aws lambda get-policy --function-name ${{ env.FUNCTION_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null | grep -q "$STATEMENT_ID"; then
            echo "Lambda permission already exists: $STATEMENT_ID"
          else
            aws lambda add-permission \
              --function-name ${{ env.FUNCTION_NAME }} \
              --statement-id $STATEMENT_ID \
              --action lambda:InvokeFunction \
              --principal apigateway.amazonaws.com \
              --source-arn "$SOURCE_ARN" \
              --region ${{ env.AWS_REGION }}
            echo "Added Lambda invoke permission for API Gateway"
          fi

          API_ENDPOINT=$(aws apigatewayv2 get-api \
            --api-id $API_ID \
            --region ${{ env.AWS_REGION }} \
            --query 'ApiEndpoint' \
            --output text)

          API_URL="$API_ENDPOINT/$STAGE_NAME"
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "✅ API Gateway URL: $API_URL"
      
      - name: Deployment Summary
        run: |
          echo "## ✅ Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully deployed Server to AWS Lambda" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Lambda Function Details:" >> $GITHUB_STEP_SUMMARY
          echo "- **Function Name:** \`${{ env.FUNCTION_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** \`${{ env.AWS_REGION }}\` (Tokyo)" >> $GITHUB_STEP_SUMMARY
          echo "- **Runtime:** Container (.NET 10)" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** x86_64" >> $GITHUB_STEP_SUMMARY
          echo "- **Memory:** 512 MB" >> $GITHUB_STEP_SUMMARY
          echo "- **Timeout:** 900 seconds (15 minutes)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ steps.api-gateway.outputs.api_url }}" ]; then
            echo "### 🌐 Access:" >> $GITHUB_STEP_SUMMARY
            echo "- **API Gateway URL:** ${{ steps.api-gateway.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Test the endpoint:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "curl ${{ steps.api-gateway.outputs.api_url }}/api/data" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Container Image:" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ steps.ecr-repo.outputs.repository_uri }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`latest\` and \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
