name: Deploy to AWS with Terraform

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'terraform/**'
      - 'Server/**'
      - '.github/workflows/terraform-deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: 1.6.0

jobs:
  terraform:
    name: 'Terraform Deploy'
    runs-on: ubuntu-latest
    environment: production
    
    # Use these permissions for OIDC
    permissions:
      contents: read
      id-token: write
    
    defaults:
      run:
        shell: bash
        working-directory: ./terraform
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check
        continue-on-error: true
      
      - name: Terraform Init
        id: init
        run: terraform init
      
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
      
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var="touker_username=${{ secrets.TOUKER_USERNAME }}" \
            -var="touker_password=${{ secrets.TOUKER_PASSWORD }}" \
            -var="touker_transaction_password=${{ secrets.TOUKER_TRANSACTION_PASSWORD }}" \
            -var="aws_region=${{ env.AWS_REGION }}"
        continue-on-error: false
      
      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 
          (github.event_name == 'push' || 
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
        run: |
          terraform apply -auto-approve -input=false \
            -var="touker_username=${{ secrets.TOUKER_USERNAME }}" \
            -var="touker_password=${{ secrets.TOUKER_PASSWORD }}" \
            -var="touker_transaction_password=${{ secrets.TOUKER_TRANSACTION_PASSWORD }}" \
            -var="aws_region=${{ env.AWS_REGION }}"
      
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve -input=false \
            -var="touker_username=${{ secrets.TOUKER_USERNAME }}" \
            -var="touker_password=${{ secrets.TOUKER_PASSWORD }}" \
            -var="touker_transaction_password=${{ secrets.TOUKER_TRANSACTION_PASSWORD }}" \
            -var="aws_region=${{ env.AWS_REGION }}"
      
      - name: Get Terraform Outputs
        if: |
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 
          (github.event_name == 'push' || 
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
        id: outputs
        run: |
          echo "server_api_url=$(terraform output -raw server_api_url)" >> $GITHUB_OUTPUT
          echo "ecr_server_repository=$(terraform output -raw ecr_server_repository_url)" >> $GITHUB_OUTPUT
          echo "ecr_client_repository=$(terraform output -raw ecr_client_repository_url)" >> $GITHUB_OUTPUT

  build-and-deploy:
    name: 'Build and Deploy Docker Images'
    runs-on: ubuntu-latest
    needs: terraform
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 
      (github.event_name == 'push' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Get ECR Repository URLs
        id: ecr
        working-directory: ./terraform
        run: |
          terraform init
          echo "server_repo=$(terraform output -raw ecr_server_repository_url)" >> $GITHUB_OUTPUT
          echo "client_repo=$(terraform output -raw ecr_client_repository_url)" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Server/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.server_repo }}:latest
            ${{ steps.ecr.outputs.server_repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Client/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.client_repo }}:latest
            ${{ steps.ecr.outputs.client_repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Update Lambda Functions
        run: |
          # Update Server Lambda
          aws lambda update-function-code \
            --function-name hbarbitrage-server \
            --image-uri ${{ steps.ecr.outputs.server_repo }}:latest \
            --region ${{ env.AWS_REGION }}
          
          # Wait for Server update to complete
          aws lambda wait function-updated \
            --function-name hbarbitrage-server \
            --region ${{ env.AWS_REGION }}
          
          # Update Client Lambda
          aws lambda update-function-code \
            --function-name hbarbitrage-client \
            --image-uri ${{ steps.ecr.outputs.client_repo }}:latest \
            --region ${{ env.AWS_REGION }}
          
          # Wait for Client update to complete
          aws lambda wait function-updated \
            --function-name hbarbitrage-client \
            --region ${{ env.AWS_REGION }}
      
      - name: Test Server Lambda
        run: |
          # Get Server API URL
          cd terraform
          SERVER_URL=$(terraform output -raw server_api_url)
          echo "Server API URL: $SERVER_URL"
          
          # Test API endpoint
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${SERVER_URL}api/health || echo "000")
          
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "404" ]; then
            echo "✓ Server Lambda is responding (HTTP $HTTP_STATUS)"
          else
            echo "⚠ Warning: Server Lambda returned HTTP $HTTP_STATUS"
          fi
      
      - name: Deployment Summary
        run: |
          cd terraform
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to AWS Lambda in ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources:" >> $GITHUB_STEP_SUMMARY
          echo "- **Server Lambda:** hbarbitrage-server" >> $GITHUB_STEP_SUMMARY
          echo "- **Client Lambda:** hbarbitrage-client" >> $GITHUB_STEP_SUMMARY
          echo "- **Server API URL:** $(terraform output -raw server_api_url)" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Schedules:" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** Daily at 14:00 Shanghai time (Mon-Fri)" >> $GITHUB_STEP_SUMMARY
          echo "- **Client:** Daily at 14:20 Shanghai time (Mon-Fri)" >> $GITHUB_STEP_SUMMARY
